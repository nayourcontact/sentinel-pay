services:
  payment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    networks:
      sentinelpay:
        aliases:
          - payment-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  agent-db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: agentdb
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    volumes:
      - agent-db-data:/var/lib/postgresql/data
    networks:
      sentinelpay:
        aliases:
          - agent-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    container_name: sentinelpay-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      sentinelpay:
        aliases:
          - kafka
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    networks:
      sentinelpay:
        aliases:
          - ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./infra/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    networks:
      - sentinelpay
    restart: unless-stopped

  payment-platform:
    build:
      context: .
      dockerfile: payment-platform/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      DB_URL: jdbc:postgresql://payment-db:5432/payments
      DB_USER: payments
      DB_PASSWORD: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_OPS_INTERNAL_KEY: ${PAYMENT_OPS_INTERNAL_KEY:-dev-ops-key}
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      sentinelpay:
        aliases:
          - payment-platform
    ports:
      - "8085:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: on-failure:5

  payment-mcp-server:
    build:
      context: .
      dockerfile: payment-mcp-server/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      MCP_SERVER_PORT: 8082
      PAYMENT_API_BASE_URL: http://payment-platform:8080
      PAYMENT_OPS_INTERNAL_KEY: ${PAYMENT_OPS_INTERNAL_KEY:-dev-ops-key}
    depends_on:
      payment-platform:
        condition: service_healthy
    networks:
      sentinelpay:
        aliases:
          - payment-mcp-server
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: on-failure:5

  ai-ops-agent:
    build:
      context: .
      dockerfile: ai-ops-agent/Dockerfile
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
      AGENT_PORT: 8081
      AGENT_DB_URL: jdbc:postgresql://agent-db:5432/agentdb
      AGENT_DB_USER: agent
      AGENT_DB_PASSWORD: agent
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:8b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      EMBEDDING_DIMENSIONS: 768
      PAYMENT_MCP_URL: http://payment-mcp-server:8082
      AGENT_API_KEY: ${AGENT_API_KEY:-dev-secret-change-me}
    depends_on:
      agent-db:
        condition: service_healthy
      ollama:
        condition: service_healthy
      payment-mcp-server:
        condition: service_healthy
    networks:
      sentinelpay:
        aliases:
          - ai-ops-agent
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: on-failure:5

  ops-ui:
    build:
      context: ./ops-ui
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: 1
    depends_on:
      payment-platform:
        condition: service_healthy
      ai-ops-agent:
        condition: service_healthy
    networks:
      - sentinelpay
    ports:
      - "3000:80"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      payment-platform:
        condition: service_healthy
      payment-mcp-server:
        condition: service_healthy
      ai-ops-agent:
        condition: service_healthy
    networks:
      - sentinelpay
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - sentinelpay
    ports:
      - "3001:3000"
    restart: unless-stopped

networks:
  sentinelpay:
    name: sentinelpay-network
    driver: bridge

volumes:
  payment-db-data:
  agent-db-data:
  ollama-data:
  tempo-data:

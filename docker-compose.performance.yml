# Run ONLY with: docker compose -p sentinelpay-perf -f docker-compose.performance.yml up -d --build
# Do not combine with the default docker-compose.yml.
name: sentinelpay-perf
services:
  perf-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: perf-local-only-password
    volumes:
      - perf-db-data:/var/lib/postgresql/data
    networks: [perf-isolated]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s

  perf-kafka:
    image: apache/kafka:4.3.1
    hostname: perf-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@perf-kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://perf-kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks: [perf-isolated]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  perf-payment-platform:
    build:
      context: .
      dockerfile: payment-platform/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://perf-db:5432/payments
      DB_USER: payments
      DB_PASSWORD: perf-local-only-password
      KAFKA_BOOTSTRAP_SERVERS: perf-kafka:29092
      PAYMENT_OPS_INTERNAL_KEY: perf-local-ops-key
      TRACING_SAMPLING_PROBABILITY: "0.0"
      MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "0.0"
    depends_on:
      perf-db:
        condition: service_healthy
      perf-kafka:
        condition: service_healthy
    networks: [perf-isolated]
    ports:
      - "127.0.0.1:18085:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

networks:
  perf-isolated:
    driver: bridge

volumes:
  perf-db-data:

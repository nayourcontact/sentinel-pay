server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri /index.html; }
  location /api/ {
    proxy_pass http://payment-platform:8080/api/;
    proxy_set_header Host $host;
  }
  location /agent-api/ {
    proxy_pass http://ai-ops-agent:8081/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-API-Key dev-secret-change-me;
  }
}

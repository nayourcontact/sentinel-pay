server:
  port: ${AGENT_PORT:8081}
  shutdown: graceful
spring:
  application:
    name: sentinelpay-ai-ops-agent
  datasource:
    url: ${AGENT_DB_URL:jdbc:postgresql://localhost:5433/agentdb}
    username: ${AGENT_DB_USER:agent}
    password: ${AGENT_DB_PASSWORD:agent}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen3:8b}
          temperature: 0.1
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
    mcp:
      client:
        enabled: true
        name: sentinelpay-ai-ops-agent
        version: 1.0.0
        type: SYNC
        request-timeout: 20s
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            payments:
              url: ${PAYMENT_MCP_URL:http://localhost:8082}
              endpoint: /mcp
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:768}
        max-document-batch-size: 1000
app:
  security:
    api-key: ${AGENT_API_KEY:dev-secret-change-me}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} trace=%X{traceId:-na} %logger{36} - %msg%n"
---
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          enabled: false
  otlp:
    metrics:
      export:
        enabled: false

server:
  port: ${MCP_SERVER_PORT:8082}
  shutdown: graceful
spring:
  application:
    name: sentinelpay-payment-mcp
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: sentinelpay-payment-operations
        version: 1.0.0
        instructions: "Read-only payment operations MCP boundary. Live payment state is authoritative. Do not infer missing payment data."
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false
sentinelpay:
  payment-api:
    base-url: ${PAYMENT_API_BASE_URL:http://localhost:8080}
    internal-key: ${PAYMENT_OPS_INTERNAL_KEY:dev-ops-key}
    oauth2:
      enabled: ${PAYMENT_API_OAUTH2_ENABLED:false}
      token-uri: ${PAYMENT_API_OAUTH2_TOKEN_URI:}
      client-id: ${PAYMENT_API_OAUTH2_CLIENT_ID:}
      client-secret: ${PAYMENT_API_OAUTH2_CLIENT_SECRET:}
    connect-timeout: ${PAYMENT_API_CONNECT_TIMEOUT:1s}
    read-timeout: ${PAYMENT_API_READ_TIMEOUT:2s}
    retry:
      max-attempts: ${PAYMENT_API_RETRY_MAX_ATTEMPTS:3}
      wait-duration: ${PAYMENT_API_RETRY_WAIT:200ms}
    circuit-breaker:
      failure-rate-threshold: ${PAYMENT_API_CB_FAILURE_THRESHOLD:50}
      minimum-calls: ${PAYMENT_API_CB_MINIMUM_CALLS:5}
      sliding-window-size: ${PAYMENT_API_CB_WINDOW_SIZE:10}
      open-duration: ${PAYMENT_API_CB_OPEN_DURATION:10s}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level service=${spring.application.name} trace=%X{traceId:-na} %logger{36} - %msg%n"
---
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
    logging:
      export:
        otlp:
          enabled: false
  otlp:
    metrics:
      export:
        enabled: false
